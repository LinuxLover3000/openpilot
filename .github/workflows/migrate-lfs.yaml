name: migrate fork LFS

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch whose reachable LFS objects to preserve
        required: true
        type: string
      confirmation:
        description: Enter MIGRATE_12_GIB to copy all reachable LFS objects into this fork
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: migrate-lfs-${{ inputs.source_branch }}
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate LFS objects to fork
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_BRANCH: ${{ inputs.source_branch }}
      SOURCE_LFS_URL: https://gitlab.com/commaai/openpilot-lfs.git/info/lfs
      FORK_LFS_URL: ${{ github.server_url }}/${{ github.repository }}.git/info/lfs
    steps:
      - name: Validate inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          git check-ref-format --branch "$SOURCE_BRANCH"
          test "$CONFIRMATION" = MIGRATE_12_GIB

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          lfs: false

      - name: Fetch all branch references
        run: git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Download all reachable LFS objects
        run: |
          set +e
          git -c lfs.url="$SOURCE_LFS_URL" -c lfs.pushurl="$SOURCE_LFS_URL" lfs fetch --all origin 2>&1 | tee lfs-fetch.log
          fetch_status=${PIPESTATUS[0]}
          set -e

          grep -oE '\[[0-9a-f]{64}\] Object does not exist' lfs-fetch.log |
            sed 's/^\[//; s/\] Object does not exist$//' |
            sort -u > unavailable-lfs-oids.txt || true

          if [ "$fetch_status" -ne 0 ] && [ ! -s unavailable-lfs-oids.txt ]; then
            exit "$fetch_status"
          fi

          if [ -s unavailable-lfs-oids.txt ]; then
            echo "::warning::$(wc -l < unavailable-lfs-oids.txt) historical LFS objects are unavailable from the source endpoint"
          fi

          while read -r oid; do
            test -f ".git/lfs/objects/${oid:0:2}/${oid:2:2}/$oid"
          done < <(git lfs ls-files "$SOURCE_BRANCH" -l | awk '{print $1}')
          git lfs fsck "$SOURCE_BRANCH"

      - name: Upload LFS objects to fork
        run: |
          git config --local lfs.url "$FORK_LFS_URL"
          git config --local lfs.pushurl "$FORK_LFS_URL"
          find .git/lfs/objects -type f -regextype posix-extended -regex '.*/[0-9a-f]{64}' -printf '%f\n' |
            sort -u > available-lfs-oids.txt
          xargs -r -n 100 git lfs push --object-id origin < available-lfs-oids.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lfs-migration-report
          path: |
            lfs-fetch.log
            unavailable-lfs-oids.txt
            available-lfs-oids.txt
          if-no-files-found: warn

      - name: Configure fork-owned LFS endpoint
        run: |
          git config --file .lfsconfig lfs.url "$FORK_LFS_URL"
          git config --file .lfsconfig lfs.pushurl "$FORK_LFS_URL"
          git config --file .lfsconfig lfs.locksverify false

      - uses: peter-evans/create-pull-request@v8.1.1 # immutable
        with:
          token: ${{ github.token }}
          branch: configure-fork-lfs/${{ inputs.source_branch }}
          base: ${{ inputs.source_branch }}
          commit-message: "Configure fork-owned LFS storage"
          title: "Configure fork-owned LFS storage"
          body: |
            **Description**

            Moves this fork from Comma's read-only LFS endpoint to its GitHub LFS storage after migrating all reachable LFS objects.

            **Verification**

            - Passed `git lfs fsck ${{ inputs.source_branch }}` after downloading the source objects.
            - Passed `git lfs push --object-id origin` against the fork endpoint.
          add-paths: .lfsconfig
